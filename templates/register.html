{% extends "base.html" %}

{% block title %}Register Account | Ai Based Synthetic Media Detection System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="forensic-card">
                <div class="text-center mb-4">
                    <div class="brand-logo-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.35rem;">
                        <i class="bi bi-person-plus-fill text-white"></i>
                    </div>
                    <div class="forensic-header-tag">PERSONNEL ONBOARDING</div>
                    <h3 class="fw-bold mb-1">Create Forensic Account</h3>
                    <p class="text-secondary small">Register to track case history and generate signed dossiers</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Full Legal Name</label>
                        <input type="text" name="full_name" class="forensic-input" placeholder="e.g. Dr. Jane Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Username</label>
                        <input type="text" name="username" class="forensic-input" placeholder="e.g. jdoe_analyst" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Official Email Address</label>
                        <input type="email" name="email" class="forensic-input" placeholder="e.g. jdoe@forensics.org" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Password (Min. 6 characters)</label>
                        <input type="password" name="password" class="forensic-input" placeholder="Create strong password" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="forensic-input" placeholder="Repeat password" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-forensic-primary w-100 justify-content-center py-2 mb-3">
                        <i class="bi bi-check2-circle me-1"></i> Register Profile
                    </button>

                    <div class="text-center text-secondary small">
                        Already have an account? 
                        <a href="{{ url_for('login') }}" class="text-info fw-semibold text-decoration-none">Sign In Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
