<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin:0;
            background: linear-gradient(135deg, #001f3f, #003366, #00509e);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-family:'Segoe UI',sans-serif;
        }
        .glass {
            width:420px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(8px);
            border-radius:12px;
            padding:35px 30px;
            text-align:center;
            box-shadow:0 6px 20px rgba(0,0,0,0.25);
            animation: fadeInUp .8s ease;
        }
        .btn-submit {
            padding:12px;
            border:none;
            border-radius:8px;
            width:100%;
            background:#ffaa00;
            font-weight:600;
            cursor:pointer;
            font-size:18px;
            transition:0.25s;
        }
        .btn-submit:hover { background:#ff9900; transform:scale(1.03); }
        input {
            font-size:16px;
            padding:12px;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>

<div class="glass">
    <h2 class="mb-3">Admin Login</h2>
    <p class="opacity-75">Restricted access for authorized admin only</p>

    <form method="POST">
        <input name="username" class="form-control mb-3" placeholder="Enter Username" required>
        <input name="password" type="password" class="form-control mb-3" placeholder="Enter Password" required>
        <button class="btn-submit">Login</button>
    </form>

    {% if error %}
        <p class="text-danger mt-3 fw-bold">{{ error }}</p>
    {% endif %}

    <a href="/" class="btn btn-light btn-sm mt-4">Back to Home</a>
</div>

</body>
</html>
