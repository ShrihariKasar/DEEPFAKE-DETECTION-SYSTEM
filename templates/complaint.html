<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFake Complaint Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #001f3f, #003366, #00509e);
            min-height:100vh;
            color:white;
            font-family:'Segoe UI',sans-serif;
            padding-top:40px;
        }
        .glass {
            width:600px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(8px);
            border-radius:12px;
            padding:30px;
            margin:auto;
            text-align:center;
            box-shadow:0 6px 20px rgba(0,0,0,0.2);
        }
        .btn-submit {
            padding:14px;
            border:none;
            border-radius:8px;
            background:#ff0066;
            color:white;
            font-weight:600;
            width:100%;
            cursor:pointer;
        }
        .btn-submit:hover { background:#e60059; }
    </style>
</head>
<body>

<div class="glass">
    <h3 class="mb-3">Report DeepFake Misuse</h3>

    <form method="POST" action="/submit_complaint" enctype="multipart/form-data">

        <input name="name" class="form-control mb-3" placeholder="Full Name" required>

        <input name="age" type="number" class="form-control mb-3" placeholder="Age" required>

        <select name="gender" class="form-control mb-3" required>
            <option disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input name="mobile" class="form-control mb-3" placeholder="Mobile Number" required maxlength="10">

        <textarea name="desc" class="form-control mb-3"
            placeholder="Describe how deepfake was misused..."
            rows="3" required></textarea>

        <label class="form-label">Upload Evidence (Image/Video)</label>
        <input name="file" type="file" class="form-control mb-3">

        <button class="btn-submit">Submit Complaint</button>
    </form>

    {% if message %}
        <p class="text-success mt-3 fw-bold">{{ message }}</p>
    {% endif %}
    {% if error %}
        <p class="text-danger mt-3 fw-bold">{{ error }}</p>
    {% endif %}

    <a href="/" class="btn btn-light btn-sm mt-3">Back</a>
</div>

</body>
</html>
